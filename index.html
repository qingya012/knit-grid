<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnitGrid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600&family=Sacramento&family=Space+Grotesk:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-toolbar">
        <div class="top-toolbar__brand-block">
          <div class="top-toolbar__brand brand-wordmark">KnitGrid</div>
          <!-- Edit signature text below (Sacramento line under the logo) -->
          <p class="brand-signature">Designed by idk</p>
        </div>
        <div class="top-toolbar__actions">
          <button
            type="button"
            id="btn-undo"
            class="btn btn-icon"
            disabled
            aria-label="Undo"
            title="Undo"
          >
            <svg
              class="icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 10h10a5 5 0 0 1 5 5v2" />
              <path d="M3 10l4-4M3 10l4 4" />
            </svg>
          </button>
          <button
            type="button"
            id="btn-redo"
            class="btn btn-icon"
            disabled
            aria-label="Redo"
            title="Redo"
          >
            <svg
              class="icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 10H11a5 5 0 0 0-5 5v2" />
              <path d="M21 10l-4-4M21 10l-4 4" />
            </svg>
          </button>
          <button
            type="button"
            id="btn-select"
            class="btn btn-icon"
            aria-label="Select"
            title="Select"
          >
            <svg
              class="icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="5" y="5" width="14" height="14" rx="1" stroke-dasharray="3 2" />
            </svg>
          </button>
          <div
            id="toolbar-selection-actions"
            class="toolbar-selection-actions"
            hidden
          >
            <button
              type="button"
              id="btn-sel-copy"
              class="btn btn-icon"
              aria-label="Copy"
              title="Copy"
            ></button>
            <button
              type="button"
              id="btn-sel-cut"
              class="btn btn-icon"
              aria-label="Cut"
              title="Cut"
            ></button>
            <button
              type="button"
              id="btn-sel-paste"
              class="btn btn-icon"
              aria-label="Paste"
              title="Paste"
            ></button>
            <button
              type="button"
              id="btn-sel-flip-h"
              class="btn btn-icon"
              aria-label="Flip horizontally"
              title="Flip horizontally"
            ></button>
            <button
              type="button"
              id="btn-sel-flip-v"
              class="btn btn-icon"
              aria-label="Flip vertically"
              title="Flip vertically"
            ></button>
          </div>
          <button type="button" id="btn-clear" class="btn">Clear</button>
        </div>
        <div class="top-toolbar__zoom" id="toolbar-zoom">
          <button
            type="button"
            id="btn-zoom-out"
            class="btn btn-icon chart-zoom-btn"
            aria-label="Zoom out"
            title="Zoom out"
          >
            −
          </button>
          <span
            id="zoom-percent-label"
            class="chart-zoom-percent"
            aria-live="polite"
          >100%</span>
          <button
            type="button"
            id="btn-zoom-in"
            class="btn btn-icon chart-zoom-btn"
            aria-label="Zoom in"
            title="Zoom in"
          >
            +
          </button>
          <button
            type="button"
            id="btn-zoom-fit"
            class="btn chart-zoom-fit-btn"
            title="Fit to view"
          >
            Fit
          </button>
        </div>
        <button type="button" id="btn-export" class="btn btn--export">
          <svg
            class="icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 3v12" />
            <path d="M8 11l4 4 4-4" />
            <path d="M4 21h16" />
          </svg>
          <span>Export</span>
        </button>
      </header>

      <div class="app-body">
        <aside class="sidebar">
          <section class="sidebar-section">
            <h2 class="sidebar-section__label">Chart</h2>
            <label class="sidebar-field">
              <span class="sidebar-field__label">Rows</span>
              <input type="number" id="input-rows" min="1" max="200" value="10" />
            </label>
            <label class="sidebar-field">
              <span class="sidebar-field__label">Columns</span>
              <input type="number" id="input-cols" min="1" max="200" value="10" />
            </label>
            <button type="button" id="btn-new-chart" class="btn btn--block">
              New Chart
            </button>
          </section>

          <section class="sidebar-section">
            <h2 class="sidebar-section__label">Stitches</h2>
            <div id="symbol-palette" class="symbol-palette"></div>
          </section>

          <section class="sidebar-section">
            <h2 class="sidebar-section__label">Color</h2>
            <div id="color-palette" class="color-palette"></div>
          </section>
        </aside>

        <main class="workspace">
          <div class="chart-viewport" id="chart-viewport">
            <div class="chart-viewport-scroll" id="chart-viewport-scroll">
              <div class="chart-viewport-center" id="chart-viewport-center">
                <div class="chart-viewport-content" id="chart-viewport-content">
                  <div id="chart-title-slot" class="chart-title-slot"></div>
                  <canvas id="chart-canvas"></canvas>
                  <div id="legend-preview" class="legend-preview"></div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <dialog id="symbol-dialog" class="editor-dialog">
      <h2 id="symbol-dialog-title">Create Symbol</h2>
      <form method="dialog" id="symbol-dialog-form">
        <div class="dialog-field">
          <span class="dialog-field-label">Stitch</span>
          <div id="stitch-control-slot" class="stitch-control-slot">
            <select id="stitch-preset"></select>
          </div>
          <button type="button" id="btn-use-preset" class="btn-use-preset" hidden>
            Use preset
          </button>
          <p
            id="stitch-field-error"
            class="dialog-field-error"
            hidden
            aria-live="polite"
          ></p>
        </div>
        <label class="dialog-field">
          Symbol
          <input type="text" id="modal-symbol-char" maxlength="4" />
          <span
            id="symbol-field-error"
            class="dialog-field-error"
            hidden
            aria-live="polite"
          ></span>
        </label>
        <div class="dialog-actions">
          <button type="button" id="btn-dialog-cancel" class="btn">Cancel</button>
          <button type="button" id="btn-dialog-create" class="btn">Create</button>
        </div>
      </form>
    </dialog>

    <dialog id="color-dialog" class="editor-dialog">
      <h2 id="color-dialog-title">Add Color</h2>
      <p class="dialog-section-label">Quick Colors</p>
      <div class="dialog-field dialog-field--compact">
        <div id="color-preset-grid" class="color-preset-grid"></div>
      </div>
      <p class="dialog-section-label">Selected Color</p>
      <div class="color-selected-block">
        <div class="color-selected-row">
          <div
            id="color-selected-preview"
            class="color-selected-preview"
            aria-hidden="true"
          ></div>
          <label class="color-hex-label">
            <span class="visually-hidden">Hex</span>
            <input
              type="text"
              id="color-hex-input"
              class="color-hex-input"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
        </div>
        <p
          id="color-field-error"
          class="dialog-field-error"
          hidden
          aria-live="polite"
        ></p>
        <button
          type="button"
          id="btn-choose-more-colors"
          class="btn-choose-more-colors"
        >
          Choose More Colors…
        </button>
        <input
          type="color"
          id="color-native-picker"
          class="color-native-picker-input"
          tabindex="-1"
        />
      </div>
      <div class="dialog-actions">
        <button type="button" id="btn-color-cancel" class="btn">Cancel</button>
        <button type="button" id="btn-color-add" class="btn">Add</button>
      </div>
    </dialog>

    <dialog id="export-dialog" class="editor-dialog">
      <h2>Export Chart</h2>
      <label class="dialog-field">
        File name
        <input
          type="text"
          id="export-filename"
          autocomplete="off"
          spellcheck="false"
        />
      </label>
      <label class="dialog-field">
        Format
        <select id="export-format">
          <option value="png" selected>PNG</option>
          <option value="jpeg">JPG</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button type="button" id="btn-export-cancel" class="btn">Cancel</button>
        <button type="button" id="btn-export-confirm" class="btn">Export</button>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
